<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدازینکو | کاتالوگ محصولات</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

  :root{
    --bg:     #050b18;
    --panel:  rgba(14,22,45,0.6);
    --card:   rgba(14,22,45,0.55);
    --border: rgba(15,169,104,0.22);
    --green:  #17e08a;
    --green-2:#0fa968;
    --ink:    #eef2fb;
    --muted:  #8b96b8;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); font-family:'Vazirmatn',Tahoma,sans-serif; color:var(--ink); }

  #bgCanvas{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, #0a1730 0%, #050b18 55%, #030710 100%);
  }
  .page{ position:relative; z-index:1; }

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:40;
    background:rgba(5,11,24,0.75); backdrop-filter:blur(14px);
    color:#fff; padding:14px 26px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    border-bottom:1px solid var(--border);
  }
  header .logo-wrap{ display:flex; align-items:center; gap:10px; }
  header img.logo{ width:36px; height:36px; border-radius:8px; background:#fff; padding:3px; }
  header .brand{ font-weight:800; font-size:16px; letter-spacing:.2px; }
  header .brand small{ display:block; font-weight:400; font-size:10.5px; color:var(--muted); margin-top:1px; }

  .header-spacer{ flex:1; }

  .visitor{
    font-size:12px; color:#cfd6f0; display:flex; align-items:center; gap:8px;
  }
  .visitor b{ color:#fff; }

  .search-bar{
    width:100%; margin-top:12px; position:relative;
  }
  .search-bar input{
    width:100%; padding:11px 44px 11px 16px; border-radius:12px; border:1px solid var(--border);
    background:rgba(255,255,255,0.05); color:#fff; font-family:inherit; font-size:13.5px;
  }
  .search-bar input::placeholder{ color:var(--muted); }
  .search-bar input:focus{ outline:2px solid var(--green); background:rgba(23,224,138,0.06); }
  .search-bar svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.7; stroke:var(--green); }

  /* ---------- category pills ---------- */
  .cats{
    display:flex; gap:8px; overflow-x:auto; padding:14px 26px;
    background:rgba(5,11,24,0.6); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    position:sticky; top:96px; z-index:35;
  }
  @media (min-width:720px){ .cats{ top:64px; } }
  .cats::-webkit-scrollbar{ height:5px; }
  .cats::-webkit-scrollbar-thumb{ background:rgba(23,224,138,0.3); border-radius:3px; }

  .pill{
    flex:0 0 auto; padding:8px 16px; border-radius:999px; border:1.5px solid var(--border);
    background:rgba(255,255,255,0.03); color:#cfd6f0; font-family:inherit; font-size:12.5px; font-weight:600;
    cursor:pointer; white-space:nowrap; transition:all .15s;
  }
  .pill .cnt{ color:var(--muted); font-weight:400; margin-right:4px; }
  .pill:hover{ border-color:var(--green); color:#fff; }
  .pill.active{
    background:linear-gradient(135deg, var(--green), var(--green-2));
    border-color:transparent; color:#04140c;
    box-shadow:0 0 18px rgba(23,224,138,0.35);
  }
  .pill.active .cnt{ color:rgba(4,20,12,0.75); }

  /* ---------- grid ---------- */
  main{ max-width:1280px; margin:0 auto; padding:24px 26px 60px; position:relative; z-index:1; }

  .section-title{
    font-size:14.5px; font-weight:800; color:var(--green); margin:26px 2px 14px;
    display:flex; align-items:center; gap:10px; letter-spacing:.3px;
  }
  .section-title .bar{ width:4px; height:16px; background:linear-gradient(var(--green),var(--green-2)); border-radius:3px; box-shadow:0 0 10px rgba(23,224,138,0.6); }
  .section-title .cnt{ font-weight:400; color:var(--muted); font-size:12px; }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:16px;
  }

  .prod-card{
    background:var(--card); backdrop-filter:blur(12px);
    border:1px solid var(--border); border-radius:16px;
    overflow:hidden; cursor:pointer; transition:transform .15s, box-shadow .15s, border-color .15s;
    display:flex; flex-direction:column;
  }
  .prod-card:hover{
    transform:translateY(-3px); box-shadow:0 14px 34px rgba(0,0,0,0.4), 0 0 0 1px rgba(23,224,138,0.3); border-color:var(--green);
  }
  .prod-card .thumb{
    width:100%; aspect-ratio:4/3; background:#fff; display:flex; align-items:center; justify-content:center;
    overflow:hidden; border-bottom:1px solid var(--border); cursor:pointer;
  }
  .prod-card .title{ cursor:pointer; }
  .prod-card .thumb img{ width:100%; height:100%; object-fit:contain; }
  .prod-card .info{ padding:12px 14px 14px; text-align:right; }
  .prod-card .title{
    font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.6;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    min-height:2.6em;
  }
  .prod-card .material{
    margin-top:7px; font-size:11px; color:var(--green); font-weight:600;
    display:flex; align-items:center; gap:5px; justify-content:flex-end;
  }
  .prod-card .pageno{
    margin-top:5px; font-size:10px; color:var(--muted);
  }
  .prod-card .btn3d{
    margin-top:10px; width:100%; padding:8px 0; border-radius:9px;
    background:linear-gradient(135deg, var(--green), var(--green-2)); border:none;
    color:#04140c; font-family:inherit; font-size:11px; font-weight:800; cursor:pointer;
    letter-spacing:.2px; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .prod-card .btn3d:hover{ filter:brightness(1.1); box-shadow:0 0 16px rgba(23,224,138,0.4); }

  .empty{
    text-align:center; padding:70px 20px; color:var(--muted); font-size:13.5px;
  }
  .empty-hero{ text-align:center; padding:34px 20px 22px; }
  .empty-hero-title{ font-size:18px; font-weight:800; color:#fff; }
  .empty-hero-sub{ font-size:12.5px; color:var(--muted); margin-top:8px; }
  .empty-cat-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
    gap:14px; padding-bottom:40px;
  }
  .empty-cat{
    border:1.5px dashed var(--border); border-radius:16px; padding:26px 16px;
    text-align:center; background:var(--panel); backdrop-filter:blur(10px);
  }
  .empty-cat-title{ font-size:13px; font-weight:700; color:#fff; }
  .empty-cat-sub{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.8; }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; background:rgba(2,4,10,0.88); z-index:100;
    display:none; align-items:center; justify-content:center; padding:20px;
    backdrop-filter:blur(6px);
  }
  .lightbox.open{ display:flex; }
  .lb-inner{
    background:#0b1226; border:1px solid var(--border); border-radius:18px; max-width:900px; width:100%;
    max-height:92vh; overflow:auto; position:relative;
    box-shadow:0 30px 90px rgba(0,0,0,0.6), 0 0 40px rgba(23,224,138,0.08);
  }
  .lb-close{
    position:absolute; top:12px; left:12px; width:34px; height:34px; border-radius:50%;
    background:rgba(23,224,138,0.15); border:1px solid var(--border); color:#fff; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; z-index:5;
  }
  .lb-close:hover{ background:var(--green); color:#04140c; }
  .lb-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%;
    background:rgba(23,224,138,0.15); border:1px solid var(--border); color:#fff; font-size:18px; cursor:pointer; z-index:5;
    display:flex; align-items:center; justify-content:center;
  }
  .lb-nav:hover{ background:var(--green); color:#04140c; }
  .lb-prev{ right:12px; }
  .lb-next{ left:12px; }
  .lb-inner img{ width:100%; display:block; background:#fff; }
  .lb-caption{ padding:16px 22px 20px; text-align:right; }
  .lb-caption .t{ font-size:15px; font-weight:800; color:#fff; }
  .lb-caption .m{ font-size:12.5px; color:var(--green); font-weight:700; margin-top:6px; }
  .lb-caption .d{ font-size:12.5px; color:#c3cbe6; line-height:2; margin-top:12px; }
  .lb-caption .p{ font-size:11px; color:var(--muted); margin-top:10px; }
  .lb-caption .lb-btn3d{
    margin-top:14px; padding:10px 18px; border-radius:10px; border:none;
    background:linear-gradient(135deg, var(--green), var(--green-2)); color:#04140c;
    font-family:inherit; font-size:12.5px; font-weight:800; cursor:pointer;
  }
  .lb-caption .lb-btn3d:hover{ filter:brightness(1.1); box-shadow:0 0 16px rgba(23,224,138,0.4); }

  footer{
    text-align:center; padding:26px; font-size:11px; color:var(--muted);
    border-top:1px solid var(--border); background:rgba(5,11,24,0.7); line-height:2; position:relative; z-index:1;
  }
</style>
</head>

</div>

  ];
  const CAT_LABEL = Object.fromEntries(CATEGORIES.map(c=>[c.key,c.label]));

  /* ---------- category bar ---------- */
  let activeCat = 'all';
  let searchTerm = '';

  function countFor(key){
    if(key==='all') return PRODUCTS.length;
    return PRODUCTS.filter(p=>p.cat===key).length;
  }

  function renderCatBar(){
    const bar = document.getElementById('catBar');
    bar.innerHTML = '';
    CATEGORIES.forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'pill' + (c.key===activeCat ? ' active' : '');
      btn.innerHTML = `${c.label} <span class="cnt">${countFor(c.key)}</span>`;
      btn.addEventListener('click', ()=>{ activeCat = c.key; render(); });
      bar.appendChild(btn);
    });
  }

  /* ---------- grid render ---------- */
  let currentList = [];

  function matches(p){
    const okCat = activeCat==='all' || p.cat===activeCat;
    const okSearch = !searchTerm || p.title.toLowerCase().includes(searchTerm) || p.material.toLowerCase().includes(searchTerm);
    return okCat && okSearch;
  }

  function render(){
    renderCatBar();
    const wrap = document.getElementById('resultsWrap');
    wrap.innerHTML = '';

    const filtered = PRODUCTS.filter(matches);
    currentList = filtered;

    if(PRODUCTS.length===0){
      // catalog structure is live, product photos are being added one by one
      const sections = CATEGORIES.slice(1).map(c=>`
        <div class="empty-cat">
          <div class="empty-cat-title">${c.label}</div>
          <div class="empty-cat-sub">قطعات این بخش به‌زودی با عکس واقعی اضافه می‌شوند</div>
        </div>`).join('');
      wrap.innerHTML = `<div class="empty-hero">
        <div class="empty-hero-title">کاتالوگ در حال تکمیل است</div>
        <div class="empty-hero-sub">قطعات به‌مرور و با عکس واقعی هرکدام اضافه می‌شوند.</div>
      </div>
      <div class="empty-cat-grid">${sections}</div>`;
      return;
    }

    if(filtered.length===0){
      wrap.innerHTML = '<div class="empty">قطعه‌ای با این مشخصات پیدا نشد.</div>';
      return;
    }

    if(activeCat !== 'all' || searchTerm){
      wrap.appendChild(buildGrid(filtered));
      return;
    }

    // grouped by category, in defined order
    CATEGORIES.slice(1).forEach(c=>{
      const items = PRODUCTS.filter(p=>p.cat===c.key);
      if(items.length===0) return;
      const title = document.createElement('div');
      title.className = 'section-title';
      title.innerHTML = `<span class="bar"></span>${c.label} <span class="cnt">(${items.length} قطعه)</span>`;
      wrap.appendChild(title);
      wrap.appendChild(buildGrid(items));
    });
  }

  function buildGrid(items){
    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'prod-card';
      card.innerHTML = `
        <div class="thumb"><img src="${p.img}" alt="${p.title}" loading="lazy"></div>
        <div class="info">
          <div class="title">${p.title}</div>
          <div class="material">جنس: ${p.material}</div>
          <div class="pageno">صفحه ${p.page} کاتالوگ</div>
          <button class="btn3d" data-page="${p.page}">&#9723; نمایش سه‌بعدی</button>
        </div>`;
      card.querySelector('.thumb').addEventListener('click', ()=> openLightbox(p));
      card.querySelector('.title').addEventListener('click', ()=> openLightbox(p));
      card.querySelector('.btn3d').addEventListener('click', (e)=>{
        e.stopPropagation();
        window.location.href = 'viewer.html?id=' + p.page;
      });
      grid.appendChild(card);
    });
    return grid;
  }

  /* ---------- search ---------- */
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  /* ---------- lightbox ---------- */
  const lightbox = document.getElementById('lbImgWrap') || document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbTitle = document.getElementById('lbTitle');
  const lbMaterial = document.getElementById('lbMaterial');
  const lbDesc = document.getElementById('lbDesc');
  const lbPage = document.getElementById('lbPage');
  let lbIndex = -1;

  function fullImgFor(p){
    if(p.img.endsWith('.png')) return p.img; // already a high-quality standalone photo
    return p.img.replace('/thumbs/', '/full/');
  }

  let lbCurrentProduct = null;
  function openLightbox(p){
    lbIndex = currentList.indexOf(p);
    paintLightbox(p);
    document.getElementById('lightbox').classList.add('open');
  }
  function paintLightbox(p){
    lbCurrentProduct = p;
    lbImg.src = fullImgFor(p);
    lbImg.alt = p.title;
    lbTitle.textContent = p.title;
    lbMaterial.textContent = 'جنس: ' + p.material;
    lbDesc.textContent = p.desc_fa || '';
    lbPage.textContent = 'صفحه ' + p.page + ' کاتالوگ';
  }
  document.getElementById('lbBtn3d').addEventListener('click', ()=>{
    if(lbCurrentProduct) window.location.href = 'viewer.html?id=' + lbCurrentProduct.page;
  });
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
  }
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', (e)=>{
    if(e.target.id==='lightbox') closeLightbox();
  });
  document.getElementById('lbPrev').addEventListener('click', ()=>{
    if(currentList.length===0) return;
    lbIndex = (lbIndex+1) % currentList.length;
    paintLightbox(currentList[lbIndex]);
  });
  document.getElementById('lbNext').addEventListener('click', ()=>{
    if(currentList.length===0) return;
    lbIndex = (lbIndex-1+currentList.length) % currentList.length;
    paintLightbox(currentList[lbIndex]);
  });
  window.addEventListener('keydown', (e)=>{
    if(!document.getElementById('lightbox').classList.contains('open')) return;
    if(e.key==='Escape') closeLightbox();
    if(e.key==='ArrowLeft') document.getElementById('lbNext').click();
    if(e.key==='ArrowRight') document.getElementById('lbPrev').click();
  });

  render();
</script>

<script>
(function(){
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, dpr;
  let particles = [];
  const COUNT = 70;
  const LINK_DIST = 130;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = document.documentElement.scrollHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function initParticles(){
    particles = [];
    const count = Math.min(COUNT, Math.floor((w*h)/18000));
    for(let i=0;i<count;i++){
      particles.push({
        x: Math.random()*w,
        y: Math.random()*h,
        vx: (Math.random()-0.5)*0.25,
        vy: (Math.random()-0.5)*0.25,
        r: 1.2 + Math.random()*1.8,
        pulse: Math.random()*Math.PI*2
      });
    }
  }

  function step(){
    ctx.clearRect(0,0,w,h);

    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      p.pulse += 0.02;
      if(p.x < -20) p.x = w+20; if(p.x > w+20) p.x = -20;
      if(p.y < -20) p.y = h+20; if(p.y > h+20) p.y = -20;
    }

    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a = particles[i], b = particles[j];
        const dx = a.x-b.x, dy = a.y-b.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < LINK_DIST){
          const op = (1 - dist/LINK_DIST) * 0.35;
          ctx.strokeStyle = `rgba(23,224,138,${op})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }

    for(const p of particles){
      const glow = 0.55 + Math.sin(p.pulse)*0.35;
      ctx.beginPath();
      ctx.fillStyle = `rgba(23,224,138,${glow})`;
      ctx.shadowColor = 'rgba(23,224,138,0.9)';
      ctx.shadowBlur = 6;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    requestAnimationFrame(step);
  }

  window.addEventListener('resize', ()=>{ resize(); initParticles(); });
  resize(); initParticles(); step();
})();
</script>
