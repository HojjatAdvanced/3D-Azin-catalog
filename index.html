<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدازینکو | ورود به کاتالوگ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

  :root{
    --navy:  #0e1a4d;
    --navy-2:#182a72;
    --green: #0fa968;
    --green-2:#12c47a;
    --ink:   #1c2440;
    --muted: #6b7488;
    --bg:    #f4f6fa;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:'Vazirmatn',Tahoma,sans-serif; background:var(--bg); }

  .wrap{
    min-height:100%; display:flex; align-items:center; justify-content:center;
    padding:32px; position:relative; overflow:hidden;
  }
  .bg-shape{
    position:absolute; border-radius:50%; filter:blur(60px); opacity:.18; pointer-events:none;
  }
  .bg-shape.s1{ width:520px; height:520px; background:var(--navy); top:-160px; right:-160px; }
  .bg-shape.s2{ width:420px; height:420px; background:var(--green); bottom:-140px; left:-140px; }

  .card{
    position:relative; z-index:1;
    width:100%; max-width:420px;
    background:#fff; border-radius:22px;
    box-shadow: 0 20px 60px rgba(14,26,77,0.12), 0 2px 8px rgba(14,26,77,0.06);
    padding:44px 38px 36px;
    text-align:center;
    border:1px solid rgba(14,26,77,0.05);
  }
  .logo{ width:150px; margin:0 auto 6px; display:block; }
  .tagline{
    font-size:12.5px; color:var(--muted); letter-spacing:.3px; margin-bottom:30px;
  }
  .heading{
    font-size:18px; font-weight:700; color:var(--ink); margin-bottom:6px;
  }
  .sub{
    font-size:12.5px; color:var(--muted); margin-bottom:28px; line-height:1.9;
  }

  .field{ text-align:right; margin-bottom:16px; }
  .field label{
    display:block; font-size:12px; color:var(--navy); font-weight:600; margin-bottom:7px;
  }
  .field input{
    width:100%; padding:13px 15px; border-radius:12px; border:1.5px solid #e3e7f0;
    font-family:inherit; font-size:14px; color:var(--ink); background:#fafbfd;
    transition:border-color .15s, background .15s;
  }
  .field input:focus{
    outline:none; border-color:var(--green); background:#fff;
  }

  .btn-primary{
    width:100%; margin-top:10px; padding:14px 0; border:none; border-radius:12px;
    background:linear-gradient(135deg, var(--navy), var(--navy-2));
    color:#fff; font-family:inherit; font-size:14.5px; font-weight:700;
    cursor:pointer; letter-spacing:.3px;
    box-shadow:0 8px 20px rgba(14,26,77,0.25);
    transition:transform .12s, box-shadow .12s;
  }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 10px 26px rgba(14,26,77,0.32); }
  .btn-primary:active{ transform:translateY(0); }

  .btn-guest{
    margin-top:14px; background:none; border:none; color:var(--green);
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    text-decoration:underline; text-underline-offset:3px;
  }

  .err{
    color:#d23c3c; font-size:12px; margin-top:10px; min-height:16px; font-weight:600;
  }

  .foot{
    margin-top:30px; padding-top:20px; border-top:1px solid #eef0f6;
    font-size:11px; color:#a3aabd; letter-spacing:.2px;
  }

  @media (max-width:420px){
    .card{ padding:34px 24px 28px; border-radius:18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bg-shape s1"></div>
  <div class="bg-shape s2"></div>

  <div class="card">
    <img class="logo" src="assets/logo.jpg" alt="MEDAZINCO">
    <div class="tagline">AzinTeb Salamat Razi</div>

    <div class="heading">ورود به کاتالوگ دیجیتال محصولات</div>
    <div class="sub">برای مشاهده‌ی کاتالوگ کامل قطعات ارتوپدی، نام خود را وارد کنید.</div>

    <form id="loginForm">
      <div class="field">
        <label for="nameInput">نام و نام خانوادگی</label>
        <input id="nameInput" type="text" placeholder="مثلاً: دکتر رضایی" autocomplete="name" maxlength="40">
      </div>
      <div class="field">
        <label for="orgInput">سازمان / بیمارستان (اختیاری)</label>
        <input id="orgInput" type="text" placeholder="نام مرکز درمانی یا شرکت" autocomplete="organization" maxlength="60">
      </div>

      <button type="submit" class="btn-primary">ورود به کاتالوگ</button>
      <div class="err" id="errMsg"></div>
    </form>

    <button class="btn-guest" id="guestBtn">ورود سریع به‌عنوان مهمان</button>

    <div class="foot">© ۲۰۲۵ آذین طب سلامت رازی — تولید فیکساتور و ایمپلنت ارتوپدی</div>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const nameInput = document.getElementById('nameInput');
  const orgInput = document.getElementById('orgInput');
  const errMsg = document.getElementById('errMsg');
  const guestBtn = document.getElementById('guestBtn');

  function goToCatalog(name, org){
    try{
      localStorage.setItem('medazinco_visitor_name', name || 'مهمان');
      localStorage.setItem('medazinco_visitor_org', org || '');
    }catch(e){}
    window.location.href = 'catalog.html';
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const name = nameInput.value.trim();
    if(!name){
      errMsg.textContent = 'لطفاً نام خود را وارد کنید.';
      nameInput.focus();
      return;
    }
    errMsg.textContent = '';
    goToCatalog(name, orgInput.value.trim());
  });

  guestBtn.addEventListener('click', function(){
    goToCatalog('مهمان', '');
  });
</script>
</body>
</html>
