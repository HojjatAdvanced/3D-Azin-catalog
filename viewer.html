<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>آذین طب سلامت رازی | نمایش سه‌بعدی</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

  :root{
    --navy:  #0e1a4d;
    --navy-2:#182a72;
    --green: #0fa968;
    --green-2:#12c47a;
    --ink:   #1c2440;
    --muted: #90a0c8;
    --bg:    #050914;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%; overflow:hidden; background:var(--bg);
    font-family:'Vazirmatn',Tahoma,sans-serif; color:#fff;
    touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none;
  }

  #stage{ position:fixed; inset:0; cursor:grab; touch-action:none; }
  #stage.dragging{ cursor:grabbing; }
  #stage canvas{ display:block; }

  .hud{ position:fixed; inset:0; pointer-events:none; z-index:10; }

  .bracket{ position:absolute; width:40px; height:40px; border:1.5px solid var(--green); opacity:.5; }
  .bracket.tl{ top:16px; right:16px; border-left:none; border-bottom:none; }
  .bracket.tr{ top:16px; left:16px; border-right:none; border-bottom:none; }
  .bracket.bl{ bottom:16px; right:16px; border-left:none; border-top:none; }
  .bracket.br{ bottom:16px; left:16px; border-right:none; border-top:none; }

  .topbar{
    position:absolute; top:0; right:0; left:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:22px 66px; pointer-events:auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:38px; height:38px; border-radius:9px; background:#fff; padding:3px; }
  .brand .txt b{ display:block; font-size:14px; letter-spacing:.3px; }
  .brand .txt small{ display:block; font-size:10px; color:var(--muted); margin-top:1px; }

  .backBtn{
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18);
    color:#fff; font-family:inherit; font-size:11.5px; padding:9px 16px; border-radius:10px;
    cursor:pointer; letter-spacing:.2px;
  }
  .backBtn:hover{ background:rgba(255,255,255,0.14); border-color:var(--green); }

  .info-block{
    position:absolute; top:96px; right:66px; max-width:420px; text-align:right;
    pointer-events:auto;
  }
  .info-block .cat{
    font-size:10.5px; letter-spacing:1.5px; color:var(--green); font-weight:700; margin-bottom:6px;
  }
  .info-block h1{ font-size:20px; font-weight:800; line-height:1.5; color:#fff; }
  .info-block .material{ margin-top:8px; font-size:12.5px; color:var(--muted); }

  /* ---------- floating info toggle + slide-up detail panel ---------- */
  .info-fab{
    position:absolute; left:26px; bottom:26px; z-index:15; pointer-events:auto;
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--green), #0c8a56);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 0 rgba(15,169,104,0.55);
    animation: fabPulse 2.2s ease-out infinite;
  }
  .info-fab svg{ width:24px; height:24px; stroke:#04140c; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  @keyframes fabPulse{
    0%   { box-shadow:0 0 0 0 rgba(15,169,104,0.55); }
    70%  { box-shadow:0 0 0 16px rgba(15,169,104,0); }
    100% { box-shadow:0 0 0 0 rgba(15,169,104,0); }
  }
  .info-panel{
    position:absolute; left:26px; bottom:90px; z-index:15; pointer-events:auto;
    width:min(360px, calc(100vw - 52px)); max-height:60vh; overflow:auto;
    background:#0a0e1e; backdrop-filter:blur(14px);
    border:1px solid rgba(15,169,104,0.35); border-radius:16px;
    padding:20px 20px 18px; text-align:right;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    transform:translateY(16px) scale(0.96); opacity:0; pointer-events:none;
    transition:all .22s ease;
  }
  .info-panel.open{ transform:translateY(0) scale(1); opacity:1; pointer-events:auto; }
  .info-panel .ip-title{ font-size:14.5px; font-weight:800; color:#fff; }
  .info-panel .ip-material{ font-size:11.5px; color:var(--green); font-weight:700; margin-top:5px; }
  .info-panel .ip-desc{ font-size:12px; line-height:1.95; color:#c3cbe6; margin-top:12px; white-space:pre-line; }
  .info-panel .ip-close{
    position:absolute; top:10px; left:10px; width:26px; height:26px; border-radius:50%;
    background:rgba(255,255,255,0.08); border:none; color:#fff; cursor:pointer; font-size:14px;
  }

  /* ---------- full-screen info mode (replaces the 3D view) ---------- */
  #infoScreen{
    display:none; position:fixed; inset:0; z-index:200;
    background:radial-gradient(ellipse at 50% 0%, #0a1730 0%, #050b18 55%, #030710 100%);
  }
  #infoScreen.open{ display:block; }
  #infoBgCanvas{ position:absolute; inset:0; z-index:0; }
  .info-screen-inner{
    position:relative; z-index:1; max-width:640px; margin:0 auto;
    padding:90px 26px 60px; text-align:right; min-height:100vh;
    box-sizing:border-box; overflow-y:auto;
  }
  .is-close{
    position:fixed; top:22px; right:26px; z-index:2;
    background:rgba(23,224,138,0.1); border:1px solid rgba(15,169,104,0.35);
    color:#fff; font-family:inherit; font-size:13px; font-weight:600;
    padding:11px 18px; border-radius:12px; cursor:pointer;
  }
  .is-close:hover{ background:rgba(23,224,138,0.2); }
  .is-cat{ font-size:11px; letter-spacing:2px; color:var(--green); font-weight:700; }
  .is-title{ font-size:24px; font-weight:900; color:#fff; margin-top:10px; line-height:1.5; }
  .is-material{ font-size:13.5px; color:var(--green); font-weight:700; margin-top:12px; }
  .is-desc{ font-size:14px; line-height:2.1; color:#c3cbe6; margin-top:22px; white-space:pre-line; }
  .info-block .material b{ color:#e8ecf8; }

  .brand-watermark{
    position:absolute; left:0; right:0; bottom:8px; z-index:8; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .brand-watermark .bw-line{
    width:64px; height:1px; background:linear-gradient(90deg, transparent, var(--green), transparent);
    opacity:0.6; animation: bwGlow 3s ease-in-out infinite;
  }
  .brand-watermark .bw-text{
    font-size:11px; letter-spacing:4px; font-weight:700; color:rgba(200,215,240,0.55);
    text-shadow:0 0 12px rgba(23,224,138,0.35);
  }
  .brand-watermark .bw-text b{ color:var(--green); }
  @keyframes bwGlow{
    0%,100%{ opacity:0.35; width:44px; }
    50%{ opacity:0.85; width:84px; }
  }

  .hint{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    font-size:10.5px; letter-spacing:1.5px; color:var(--muted);
  }

  #gesturePanel{
    position:absolute; right:66px; bottom:26px; width:190px; pointer-events:auto;
    border:1px solid rgba(255,255,255,0.14); background:rgba(10,14,30,0.75);
    padding:10px; border-radius:12px; backdrop-filter:blur(4px);
  }
  #gesturePanel .gp-head{
    display:flex; justify-content:space-between; align-items:center;
    font-size:9.5px; letter-spacing:1.5px; color:var(--muted); margin-bottom:8px;
  }
  #gesturePanel .gp-head b{ color:var(--green); }
  #gestureCanvas{
    width:100%; height:112px; display:block; border-radius:8px;
    background:#03060d; border:1px solid rgba(255,255,255,0.12);
    transform:scaleX(-1);
  }
  #gestureStatus{ margin-top:7px; font-size:10px; letter-spacing:.5px; color:#dfe6fa; min-height:14px; }
  #gestureToggle{
    margin-top:8px; width:100%; padding:8px 0; border-radius:8px;
    background:none; border:1px solid rgba(255,255,255,0.18); color:#fff;
    font-family:inherit; font-size:9.5px; letter-spacing:1px; cursor:pointer;
  }
  #gestureToggle:hover{ background:rgba(255,255,255,0.08); border-color:var(--green); }
  #gestureToggle.active{ color:var(--green); border-color:var(--green); }
  #gestureNote{ margin-top:6px; font-size:8.5px; color:var(--muted); line-height:1.5; display:none; }
  #gestureNote.show{ display:block; }

  @media (max-width:760px){
    .topbar{ padding:16px 20px; }
    .info-block{ right:20px; top:78px; max-width:260px; }
    .info-block h1{ font-size:16px; }
    #gesturePanel{ display:none; }
  }

  /* ---------- mobile analog sticks ---------- */
  .joystick{
    display:none;
    position:fixed; bottom:130px; width:78px; height:78px; z-index:20;
    pointer-events:auto; touch-action:none;
  }
  .joy-rotate{ left:18px; }
  .joy-zoom{ right:18px; }
  .joy-ring{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, rgba(20,32,70,0.85), rgba(6,10,22,0.9));
    border:1.5px solid rgba(15,169,104,0.45);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 8px 24px rgba(0,0,0,0.45),
      0 0 18px rgba(15,169,104,0.18);
  }
  .joy-ring::after{
    content:''; position:absolute; inset:10px; border-radius:50%;
    border:1px dashed rgba(15,169,104,0.28);
  }
  .joy-knob{
    position:absolute; width:32px; height:32px; border-radius:50%;
    top:50%; left:50%; margin:-16px 0 0 -16px;
    background:radial-gradient(circle at 35% 30%, #1fd98a, #0c8a56 70%);
    box-shadow:
      0 0 14px rgba(15,169,104,0.75),
      0 4px 10px rgba(0,0,0,0.5),
      0 0 0 2px rgba(255,255,255,0.12) inset;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1);
    will-change:transform;
  }
  .joystick.active .joy-knob{ transition:none; }
  .joystick.active .joy-ring{ border-color:rgba(15,169,104,0.85); box-shadow:0 0 0 1px rgba(255,255,255,0.06) inset, 0 8px 24px rgba(0,0,0,0.5), 0 0 26px rgba(15,169,104,0.4); }
  .joy-label{
    position:absolute; bottom:-20px; left:0; right:0; text-align:center;
    font-size:9.5px; letter-spacing:1.5px; color:var(--muted); font-weight:600;
  }
  .joy-zoom .joy-ring::before{
    content:'+'; position:absolute; top:6px; left:50%; transform:translateX(-50%);
    font-size:13px; color:rgba(255,255,255,0.35); font-weight:700;
  }
  .joy-zoom::after{
    content:'−'; position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    font-size:15px; color:rgba(255,255,255,0.35); font-weight:700;
  }

  @media (max-width:760px), (hover:none) and (pointer:coarse){
    .joystick{ display:block; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<div class="hud">
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="topbar">
    <div class="brand">
      <img src="assets/logo.jpg" alt="MEDAZINCO">
      <div class="txt"><b>MEDAZINCO</b><small>AzinTeb Salamat Razi</small></div>
    </div>
    <button class="backBtn" id="backBtn">&rsaquo; بازگشت به کاتالوگ</button>
  </div>

  <div class="info-block">
    <div class="cat" id="catLabel">—</div>
    <h1 id="prodTitle">در حال بارگذاری…</h1>
    <div class="material" id="prodMaterial"></div>
    <div id="colorSwatches" style="display:none; margin-top:14px; gap:10px; justify-content:flex-end;"></div>
  </div>

  <div class="hint">درگ برای چرخش · اسکرول برای زوم — یا کف دست باز برای چرخش · مشت‌کردن برای زوم</div>

  <div class="brand-watermark">
    <div class="bw-line"></div>
    <div class="bw-text">MEDAZINCO · <b>آذین طب سلامت رازی</b></div>
  </div>

  <button class="info-fab" id="infoFab" title="اطلاعات کامل قطعه">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.6" r="0.9" fill="#04140c" stroke="none"/></svg>
  </button>

  <div id="gesturePanel">
    <div class="gp-head"><span>سنسور دست</span><b id="gpHandState">خاموش</b></div>
    <canvas id="gestureCanvas" width="200" height="120"></canvas>
    <div id="gestureStatus">آماده به کار</div>
    <button id="gestureToggle">فعال‌سازی کنترل با دست</button>
    <div id="gestureNote">دوربین در دسترس نیست. این فایل را مستقیم در مرورگر (نه با دبل‌کلیک ساده) باز کنید.</div>
  </div>

  <div class="joystick joy-rotate" id="joyRotate">
    <div class="joy-ring"></div>
    <div class="joy-knob" id="joyRotateKnob"></div>
    <div class="joy-label">چرخش</div>
  </div>
  <div class="joystick joy-zoom" id="joyZoom">
    <div class="joy-ring"></div>
    <div class="joy-knob" id="joyZoomKnob"></div>
    <div class="joy-label">زوم</div>
  </div>
</div>

<div id="infoScreen">
  <canvas id="infoBgCanvas"></canvas>
  <div class="info-screen-inner">
    <button class="is-close" id="isClose">&times; بازگشت به نمایش سه‌بعدی</button>
    <div class="is-cat" id="isCat"></div>
    <div class="is-title" id="isTitle"></div>
    <div class="is-material" id="isMaterial"></div>
    <div class="is-desc" id="isDesc"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  function circlePath(cx,cy,r){ const p = new THREE.Path(); p.absarc(cx,cy,r,0,Math.PI*2,false); return p; }

  function buildPlate(){
    const len = 200 + rnd(seed)*90;
    const halfLen = len/2;
    const width = 26 + rnd(seed+1)*14;
    const holeCount = 4 + Math.floor(rnd(seed+2)*4);

    const shape = new THREE.Shape();
    const kf = [
      [-halfLen, 3], [-halfLen*0.9, width*0.42], [-halfLen*0.7, width*0.5],
      [0, width*0.46], [halfLen*0.7, width*0.5], [halfLen*0.9, width*0.42], [halfLen, 3]
    ];
    function hw(x){
      for(let i=0;i<kf.length-1;i++){
        const a=kf[i], b=kf[i+1];
        if(x>=a[0] && x<=b[0]){
          let t=(x-a[0])/(b[0]-a[0]); t=t*t*(3-2*t);
          return a[1]+(b[1]-a[1])*t;
        }
      }
      return kf[kf.length-1][1];
    }
    const steps=60;
    for(let i=0;i<=steps;i++){ const x=-halfLen+len*i/steps, y=hw(x); i===0?shape.moveTo(x,y):shape.lineTo(x,y); }
    for(let i=steps;i>=0;i--){ const x=-halfLen+len*i/steps, y=-hw(x); shape.lineTo(x,y); }
    shape.closePath();

    for(let i=0;i<holeCount;i++){
      const t = (i+0.5)/holeCount;
      const x = -halfLen*0.82 + len*0.72*t;
      shape.holes.push(circlePath(x,0,width*0.14));
    }

    const geo = new THREE.ExtrudeGeometry(shape, { depth:8, bevelEnabled:true, bevelThickness:1.3, bevelSize:1.3, bevelSegments:3, curveSegments:20 });
    geo.translate(0,0,-4);
    const pos = geo.attributes.position;
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i), z=pos.getZ(i);
      const t=(x+halfLen)/len;
      pos.setZ(i, z + Math.sin(t*Math.PI)*14);
    }
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  }

  function buildRing(){
    const t = product.title.toLowerCase();
    // clearly distinct geometry per ring type: sweep fraction, radius and hole density all differ
    let sweepFrac = 1.0, radiusScale = 1.0, holeDensity = 1.0;
    if(product.page===74){ sweepFrac = 0.5; radiusScale = 0.92; holeDensity = 0.85; }        // Half Ring
    else if(product.page===75){ sweepFrac = 0.7; radiusScale = 1.0; holeDensity = 1.0; }     // Ring 3/4, 5/8
    else if(product.page===73){ sweepFrac = 1.0; radiusScale = 1.0; holeDensity = 1.2; }     // Full Ring
    else if(t.includes('5/8')){ sweepFrac = 0.625; radiusScale = 1.0; holeDensity = 1.0; }
    else if(t.includes('half')){ sweepFrac = 0.5; radiusScale = 0.92; holeDensity = 0.85; }
    else if(t.includes('arch')){ sweepFrac = 0.42; radiusScale = 1.12; holeDensity = 0.7; }
    else if(t.includes('full')){ sweepFrac = 1.0; radiusScale = 1.0; holeDensity = 1.2; }

    const outerR = (95 + rnd(seed)*14) * radiusScale;
    const innerR = outerR - (15 + rnd(seed+1)*5);
    const gapCenter = Math.PI/2;
    const gapHalf = (1-sweepFrac)*Math.PI;
    const startA = gapCenter + gapHalf;
    const endA   = gapCenter - gapHalf + Math.PI*2;

    const shape = new THREE.Shape();
    const segs = 96;
    if(sweepFrac >= 0.999){
      shape.absarc(0,0,outerR,0,Math.PI*2,false);
      shape.holes.push(circlePath(0,0,innerR));
    } else {
      for(let i=0;i<=segs;i++){ const a=startA+(endA-startA)*i/segs; const x=Math.cos(a)*outerR,y=Math.sin(a)*outerR; i===0?shape.moveTo(x,y):shape.lineTo(x,y); }
      for(let i=segs;i>=0;i--){ const a=startA+(endA-startA)*i/segs; const x=Math.cos(a)*innerR,y=Math.sin(a)*innerR; shape.lineTo(x,y); }
      shape.closePath();
    }

    const midR = (outerR+innerR)/2;
    const holeR = 4.4;
    const nHoles = Math.max(4, Math.round((14 + Math.floor(rnd(seed+2)*6)) * sweepFrac * holeDensity + 3));
    const marginFrac = sweepFrac>=0.999 ? 0 : 0.08;
    for(let i=0;i<nHoles;i++){
      const t2 = sweepFrac>=0.999 ? i/nHoles : marginFrac + (1-2*marginFrac)*i/Math.max(1,(nHoles-1));
      const a = sweepFrac>=0.999 ? t2*Math.PI*2 : startA+(endA-startA)*t2;
      shape.holes.push(circlePath(Math.cos(a)*midR, Math.sin(a)*midR, holeR));
    }

    const geo = new THREE.ExtrudeGeometry(shape, { depth:9, bevelEnabled:true, bevelThickness:1.3, bevelSize:1.3, bevelSegments:3, curveSegments:40 });
    geo.translate(0,0,-4.5);
    return new THREE.Mesh(geo, mat);
  }

  function buildFootRing(){
    // custom shape matching the real photographed part: a horseshoe/"U" band
    // with two straight parallel arms and a rounded bottom, open at the top —
    // with the tightly-packed DOUBLE row of holes seen in the real photo.
    const armGap = 96, armHalfW = 20, armTop = 122, R = armGap/2;
    const outerR = R + armHalfW, innerR = R - armHalfW;
    const shape = new THREE.Shape();
    const segs = 56;
    shape.moveTo(-outerR, armTop);
    shape.lineTo(-outerR, 0);
    for(let i=0;i<=segs;i++){ const a = Math.PI + Math.PI*(i/segs); shape.lineTo(Math.cos(a)*outerR, Math.sin(a)*outerR); }
    shape.lineTo(outerR, armTop);
    shape.lineTo(innerR, armTop);
    shape.lineTo(innerR, 0);
    for(let i=0;i<=segs;i++){ const a = 2*Math.PI - Math.PI*(i/segs); shape.lineTo(Math.cos(a)*innerR, Math.sin(a)*innerR); }
    shape.lineTo(-innerR, armTop);
    shape.closePath();

    const holeR = 4.4;
    const rowOffset = armHalfW * 0.55;      // distance of each hole-row from the arm centerline
    const rowInner = R - rowOffset;
    const rowOuter = R + rowOffset;

    // two tightly-packed, staggered rows of holes running the length of each arm
    const armSpacing = 15.5;
    const startY = 16, endY = armTop - 12;
    const armHoleCount = Math.floor((endY-startY)/armSpacing) + 1;
    for(let i=0;i<armHoleCount;i++){
      const yA = startY + i*armSpacing;
      const yB = yA + armSpacing/2;
      [-1,1].forEach(side=>{
        shape.holes.push(circlePath(side*rowInner, yA, holeR));
        if(yB < endY + armSpacing/2) shape.holes.push(circlePath(side*rowOuter, yB, holeR));
      });
    }

    // two concentric, staggered rows of holes around the curved bottom
    const bottomCount = 9;
    for(let i=0;i<bottomCount;i++){
      const t = i/(bottomCount-1);
      const a1 = Math.PI + Math.PI*t;
      shape.holes.push(circlePath(Math.cos(a1)*rowInner, Math.sin(a1)*rowInner, holeR));
      if(i < bottomCount-1){
        const a2 = Math.PI + Math.PI*(t + 0.5/(bottomCount-1));
        shape.holes.push(circlePath(Math.cos(a2)*rowOuter, Math.sin(a2)*rowOuter, holeR));
      }
    }

    const geo = new THREE.ExtrudeGeometry(shape, { depth:9, bevelEnabled:true, bevelThickness:1.3, bevelSize:1.3, bevelSegments:3, curveSegments:40 });
    geo.translate(0,0,-4.5);
    return new THREE.Mesh(geo, mat);
  }

  /* ============================================================
     ARC RING — curved bracket with wide 4-hole clusters at both
     ends, an elongated central slot, and scattered small-hole
     clusters flanking it, matching the real photographed part.
  ============================================================ */
  function buildArcRing(){
    const Rc = 145;
    const halfAngle = 52 * Math.PI/180;

    function halfWidthAt(t){
      const at = Math.abs(t);
      if(at > 0.82){ const k=(at-0.82)/0.18; return 34 - k*10; }
      if(at > 0.5) { const k=(at-0.5)/0.32; return 20 + k*14; }
      return 15 + at*(20-15)/0.5;
    }
    function pt(a, rho){ return [rho*Math.sin(a), Rc - rho*Math.cos(a)]; }

    const shape = new THREE.Shape();
    const segs = 60;
    for(let i=0;i<=segs;i++){
      const t = -1 + 2*i/segs, a = t*halfAngle, rho = Rc + halfWidthAt(t);
      const [x,y] = pt(a,rho);
      i===0 ? shape.moveTo(x,y) : shape.lineTo(x,y);
    }
    for(let i=segs;i>=0;i--){
      const t = -1 + 2*i/segs, a = t*halfAngle, rho = Rc - halfWidthAt(t);
      const [x,y] = pt(a,rho);
      shape.lineTo(x,y);
    }
    shape.closePath();

    const holeR = 5.6;
    [-1,1].forEach(side=>{
      [0.72,0.90].forEach(tOff=>{
        [-6,6].forEach(rhoOff=>{
          const t = side*tOff, a = t*halfAngle, rho = Rc + rhoOff;
          const [x,y] = pt(a,rho);
          shape.holes.push(circlePath(x,y,holeR));
        });
      });
    });

    const smallR = 3.6;
    const cluster = [[0.32,-9],[0.38,3],[0.44,-4],[0.49,7],[0.55,-2],[0.60,5]];
    [-1,1].forEach(side=>{
      cluster.forEach(([tOff,rhoOff])=>{
        const t = side*tOff, a = t*halfAngle, rho = Rc + rhoOff;
        const [x,y] = pt(a,rho);
        shape.holes.push(circlePath(x,y,smallR));
      });
    });

    // central elongated slot (stadium), traced directly since near-flat at t=0
    const slotHalfLen = 44, slotHalfW = 7.5, segs2 = 16;
    const slotPath = new THREE.Path();
    slotPath.moveTo(-slotHalfLen, slotHalfW);
    for(let i=0;i<=segs2;i++){ const ang = Math.PI/2 + Math.PI*(i/segs2); slotPath.lineTo(-slotHalfLen + slotHalfW*Math.cos(ang), slotHalfW*Math.sin(ang)); }
    slotPath.lineTo(slotHalfLen, -slotHalfW);
    for(let i=0;i<=segs2;i++){ const ang = -Math.PI/2 + Math.PI*(i/segs2); slotPath.lineTo(slotHalfLen + slotHalfW*Math.cos(ang), slotHalfW*Math.sin(ang)); }
    slotPath.closePath();
    shape.holes.push(slotPath);

    const geo = new THREE.ExtrudeGeometry(shape, { depth:8, bevelEnabled:true, bevelThickness:1.2, bevelSize:1.2, bevelSegments:3, curveSegments:40 });
    geo.translate(0,0,-4);
    return new THREE.Mesh(geo, mat);
  }

  /* ============================================================
     OBLIQUE CONNECTION — bent connector, eyelet at one end,
     threaded stud at the other.
  ============================================================ */
  function buildOblique(){
    const g = new THREE.Group();
    const eyeR = 10.5, eyeHoleR = 5.4;
    const ring = new THREE.Mesh(new THREE.TorusGeometry((eyeR+eyeHoleR)/2, (eyeR-eyeHoleR)/2, 14, 28), mat);
    ring.position.set(-42, 14, 0);
    g.add(ring);

    const armPts = [[-42,14],[-30,16],[-10,17],[10,15],[26,8],[36,2]];
    for(let i=0;i<armPts.length-1;i++){
      const a = armPts[i], b = armPts[i+1];
      const dx=b[0]-a[0], dy=b[1]-a[1];
      const len = Math.sqrt(dx*dx+dy*dy);
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(9,9,len+4,16), mat);
      seg.position.set((a[0]+b[0])/2, (a[1]+b[1])/2, 0);
      seg.rotation.z = Math.atan2(dy,dx) + Math.PI/2;
      g.add(seg);
    }
    const shaftLen = 26;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(5,5,shaftLen,18), mat);
    shaft.rotation.z = Math.PI/2;
    shaft.position.set(36 + shaftLen/2, 2, 0);
    g.add(shaft);
    for(let i=0;i<7;i++){
      const trow = new THREE.Mesh(new THREE.TorusGeometry(5.3,0.8,6,16), mat);
      trow.rotation.y = Math.PI/2;
      trow.position.set(36 + 2 + i*3.3, 2, 0);
      g.add(trow);
    }
    g.position.x = -6;
    return g;
  }

  /* ============================================================
     CONNECTION PLATE — flat bar with an evenly spaced row of
     round holes.
  ============================================================ */
  function buildConnPlate(){
    const holeCount = 4, spacing = 22;
    const len = spacing*(holeCount-1) + 30, w = 20;
    const shape = new THREE.Shape();
    const r = w/2;
    shape.moveTo(-len/2 + r, -w/2);
    shape.lineTo(len/2 - r, -w/2);
    shape.absarc(len/2 - r, 0, r, -Math.PI/2, Math.PI/2, false);
    shape.lineTo(-len/2 + r, w/2);
    shape.absarc(-len/2 + r, 0, r, Math.PI/2, 3*Math.PI/2, false);
    for(let i=0;i<holeCount;i++){
      const x = -len/2 + 15 + i*spacing;
      shape.holes.push(circlePath(x, 0, 5.4));
    }
    const geo = new THREE.ExtrudeGeometry(shape, { depth:9, bevelEnabled:true, bevelThickness:1.2, bevelSize:1.2, bevelSegments:3, curveSegments:24 });
    geo.translate(0,0,-4.5);
    return new THREE.Mesh(geo, mat);
  }

  /* ============================================================
     COUPLING — hex-prism connector with an axial threaded hole.
  ============================================================ */
  function buildCoupling(){
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 30, 6), mat);
    g.add(body);
    const hole = new THREE.Mesh(new THREE.CylinderGeometry(5.4, 5.4, 32, 20), darkMat);
    g.add(hole);
    return g;
  }

  /* ============================================================
     BUSHING — short cylinder with two perpendicular threaded holes.
  ============================================================ */
  function buildBushing(){
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(13, 13, 16, 24), mat);
    g.add(body);
    const holeV = new THREE.Mesh(new THREE.CylinderGeometry(5.6, 5.6, 18, 18), darkMat);
    g.add(holeV);
    const holeH = new THREE.Mesh(new THREE.CylinderGeometry(5.6, 5.6, 28, 18), darkMat);
    holeH.rotation.z = Math.PI/2;
    holeH.position.y = -1;
    g.add(holeH);
    return g;
  }

  /* ============================================================
     THREADED ROD PART — full-length threaded rod (Ilizarov).
  ============================================================ */
  function buildThreadedRodPart(){
    const g = new THREE.Group();
    const length = 210 + rnd(seed)*60;
    const dia = 7;
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(dia/2, dia/2, length, 24), mat);
    rod.rotation.z = Math.PI/2;
    g.add(rod);
    const threadCount = Math.floor(length/5.2);
    for(let i=0;i<threadCount;i++){
      const trow = new THREE.Mesh(new THREE.TorusGeometry(dia/2*1.06, 0.85, 6, 16), mat);
      trow.rotation.y = Math.PI/2;
      trow.position.x = -length/2 + i*5.2;
      g.add(trow);
    }
    return g;
  }

  const BUILDERS = { plate:buildPlate, nail:buildNail, screw:buildScrew, rod:buildRod, tube:buildTube, ring:buildRing, footring:buildFootRing, washer:buildWasher, wire:buildWire, wrench:buildWrench, block:buildBlock,
    arcring:buildArcRing, malehinge:buildMaleHinge, femalehinge:buildFemaleHinge, malepost:buildMalePost, femalepost:buildFemalePost,
    connplate:buildConnPlate, oblique:buildOblique, coupling:buildCoupling, bushing:buildBushing, threadedrodpart:buildThreadedRodPart };

  let partMesh = null;
  const introStart0 = performance.now();
  const INTRO_MS = 850;
  function easeOutBack(x){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); }
  let introActive = false;
  let introStart = introStart0;

  function finishSetup(){
    partMesh.scale.setScalar(0.001);
    core.add(partMesh);
    introStart = performance.now();
    introActive = true;
    applyColorSwatches();
  }

  if(product.model){
    /* real CAD-exported STL model — exact geometry, no approximation */
    const stlLoader = new THREE.STLLoader();
    stlLoader.load(product.model, function(geometry){
      geometry.center();
      geometry.computeVertexNormals();
      partMesh = new THREE.Mesh(geometry, mat);
      finishSetup();
    }, undefined, function(err){
      console.error('STL load failed, falling back to procedural shape', err);
      partMesh = (BUILDERS[archetype] || buildBlock)();
      finishSetup();
    });
  } else {
    partMesh = (BUILDERS[archetype] || buildBlock)();
    finishSetup();
  }

  /* color swatches — generic: any product with real-photographed color variants shows a picker */
  function applyColorSwatches(){
  if(product.colorVariants && product.colorVariants.length > 1){
    const wrap = document.getElementById('colorSwatches');
    wrap.style.display = 'flex';
    wrap.innerHTML = '';
    product.colorVariants.forEach((c, i)=>{
      const btn = document.createElement('button');
      btn.title = c.name;
      btn.style.cssText = `width:26px;height:26px;border-radius:50%;border:2px solid ${i===0?'#fff':'rgba(255,255,255,0.35)'};background:${c.hex};cursor:pointer;padding:0;`;
      btn.addEventListener('click', ()=>{
        mat.color.set(c.hex);
        mat.emissive.set(c.hex);
        Array.from(wrap.children).forEach(b=> b.style.borderColor = 'rgba(255,255,255,0.35)');
        btn.style.borderColor = '#fff';
      });
      wrap.appendChild(btn);
    });
    // start on the first variant, matching the primary catalog photo
    mat.color.set(product.colorVariants[0].hex);
    mat.emissive.set(product.colorVariants[0].hex);
  }
  }


  /* ============================================================
     INTERACTION
  ============================================================ */
  let isDragging = false;
  let prev = { x:0, y:0 };
  let autoRotate = true;
  let targetRotX = 0, targetRotY = 0.4;
  let targetZoom = camera.position.z;
  const ROT_DAMP = 0.14, ZOOM_DAMP = 0.16;
  const ZOOM_MIN = 140, ZOOM_MAX = 720;

  function pointerDown(e){
    isDragging = true; autoRotate = false;
    const p = e.touches ? e.touches[0] : e;
    prev.x = p.clientX; prev.y = p.clientY;
    stage.classList.add('dragging');
    if(e.touches) e.preventDefault();
  }
  function pointerMove(e){
    if(!isDragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - prev.x, dy = p.clientY - prev.y;
    prev.x = p.clientX; prev.y = p.clientY;
    targetRotY += dx*0.006; targetRotX += dy*0.006;
    targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
    if(e.touches) e.preventDefault();
  }
  function pointerUp(){
    isDragging = false; stage.classList.remove('dragging');
    setTimeout(()=>{ if(!isDragging) autoRotate = true; }, 2400);
  }
  stage.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  stage.addEventListener('touchstart', pointerDown, {passive:false});
  window.addEventListener('touchmove', pointerMove, {passive:false});
  window.addEventListener('touchend', pointerUp);
  window.addEventListener('touchcancel', pointerUp);
  stage.addEventListener('wheel', (e)=>{
    e.preventDefault();
    targetZoom += e.deltaY*0.4;
    targetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, targetZoom));
  }, { passive:false });
  document.addEventListener('gesturestart', (e)=> e.preventDefault());
  document.addEventListener('gesturechange', (e)=> e.preventDefault());

  /* ============================================================
     MOBILE ANALOG STICKS — rotate (left) & zoom (right)
  ============================================================ */
  function setupJoystick(baseId, knobId, opts){
    const base = document.getElementById(baseId);
    const knob = document.getElementById(knobId);
    const maxR = 21; // px the knob can travel from center
    const state = { x:0, y:0, active:false };
    let touchId = null;

    function setKnob(nx, ny){
      knob.style.transform = `translate(${nx*maxR}px, ${ny*maxR}px)`;
    }
    function reset(){
      state.x = 0; state.y = 0; state.active = false;
      touchId = null;
      base.classList.remove('active');
      setKnob(0,0);
    }
    function handleAt(clientX, clientY){
      const rect = base.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      let dx = (clientX - cx) / maxR, dy = (clientY - cy) / maxR;
      const mag = Math.hypot(dx, dy);
      if(mag > 1){ dx /= mag; dy /= mag; }
      state.x = dx; state.y = dy;
      setKnob(dx, dy);
    }

    base.addEventListener('touchstart', (e)=>{
      e.preventDefault(); e.stopPropagation();
      const t = e.changedTouches[0];
      touchId = t.identifier;
      state.active = true;
      base.classList.add('active');
      autoRotate = false;
      handleAt(t.clientX, t.clientY);
    }, {passive:false});

    window.addEventListener('touchmove', (e)=>{
      if(touchId===null) return;
      for(const t of e.changedTouches){
        if(t.identifier===touchId){ e.preventDefault(); handleAt(t.clientX, t.clientY); }
      }
    }, {passive:false});

    window.addEventListener('touchend', (e)=>{
      if(touchId===null) return;
      for(const t of e.changedTouches){ if(t.identifier===touchId) reset(); }
    });
    window.addEventListener('touchcancel', ()=>{ if(touchId!==null) reset(); });

    // mouse support (desktop testing)
    base.addEventListener('mousedown', (e)=>{
      e.preventDefault(); e.stopPropagation();
      state.active = true; base.classList.add('active'); autoRotate = false;
      handleAt(e.clientX, e.clientY);
      function mv(ev){ handleAt(ev.clientX, ev.clientY); }
      function up(){ reset(); window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); }
      window.addEventListener('mousemove', mv);
      window.addEventListener('mouseup', up);
    });

    return state;
  }

  const rotateStick = setupJoystick('joyRotate', 'joyRotateKnob');
  const zoomStick = setupJoystick('joyZoom', 'joyZoomKnob');
  const ROTATE_STICK_SPEED = 0.045;
  const ZOOM_STICK_SPEED = 9;

  /* ============================================================
     HAND GESTURE CONTROL
  ============================================================ */
  const gpToggle = document.getElementById('gestureToggle');
  const gpStatus = document.getElementById('gestureStatus');
  const gpHandState = document.getElementById('gpHandState');
  const gpNote = document.getElementById('gestureNote');
  const gCanvas = document.getElementById('gestureCanvas');
  const gCtx = gCanvas.getContext('2d');

  const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

  let videoEl=null, mediaStream=null, handsModel=null, gestureActive=false, lastHandSeenAt=0;
  let smoothedPinchRatio=null, lastPinchRatio=null, smoothedPalm=null, lastPalm=null;
  let candidateShape=null, candidateCount=0, committedShape='NONE';

  const EXTEND_MARGIN=1.15, PINCH_SPLIT=0.62, DEBOUNCE_FRAMES=3, EMA_PALM=0.5, EMA_PINCH=0.45;
  const ZOOM_SENSITIVITY=420, ROTATE_SENSITIVITY=3.0;

  function dist2D(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
  function lerp(a,b,t){ return a+(b-a)*t; }

  function classifyHandRaw(lm){
    const wrist=lm[0], handScale=dist2D(wrist,lm[5])||0.001;
    const ext=(tipIdx,pipIdx)=> dist2D(wrist,lm[tipIdx]) > dist2D(wrist,lm[pipIdx])*EXTEND_MARGIN;
    const indexExt=ext(8,6), middleExt=ext(12,10), ringExt=ext(16,14), pinkyExt=ext(20,18);
    const pinchRatio = dist2D(lm[4],lm[8])/handScale;
    const claw = !middleExt && !ringExt && !pinkyExt;
    let shape;
    if(claw && pinchRatio<PINCH_SPLIT) shape='PINCH';
    else if(indexExt&&middleExt&&ringExt&&pinkyExt) shape='OPEN';
    else shape='UNKNOWN';
    return { shape, pinchRatio };
  }
  function debounce(rawShape){
    if(rawShape===candidateShape) candidateCount++;
    else { candidateShape=rawShape; candidateCount=1; }
    if(candidateCount>=DEBOUNCE_FRAMES) committedShape=rawShape;
    return committedShape;
  }
  function drawHandOverlay(landmarks, shape){
    gCtx.clearRect(0,0,gCanvas.width,gCanvas.height);
    if(videoEl && videoEl.readyState>=2) gCtx.drawImage(videoEl,0,0,gCanvas.width,gCanvas.height);
    gCtx.fillStyle='rgba(4,6,12,0.25)'; gCtx.fillRect(0,0,gCanvas.width,gCanvas.height);
    if(!landmarks) return;
    const toXY=(lm)=>[lm.x*gCanvas.width, lm.y*gCanvas.height];
    gCtx.strokeStyle='rgba(15,169,104,0.85)'; gCtx.lineWidth=1.5;
    HAND_CONNECTIONS.forEach(([a,b])=>{ const [ax,ay]=toXY(landmarks[a]), [bx,by]=toXY(landmarks[b]); gCtx.beginPath(); gCtx.moveTo(ax,ay); gCtx.lineTo(bx,by); gCtx.stroke(); });
    landmarks.forEach((lm)=>{ const [x,y]=toXY(lm); gCtx.beginPath(); gCtx.fillStyle='#dfe6fa'; gCtx.arc(x,y,2,0,Math.PI*2); gCtx.fill(); });
    if(shape==='PINCH'){ const [tx,ty]=toXY(landmarks[4]), [ix,iy]=toXY(landmarks[8]); gCtx.beginPath(); gCtx.strokeStyle='#ff5b5b'; gCtx.lineWidth=2; gCtx.moveTo(tx,ty); gCtx.lineTo(ix,iy); gCtx.stroke(); }
  }
  function onHandResults(results){
    const hasHand = results.multiHandLandmarks && results.multiHandLandmarks.length>0;
    if(!hasHand){
      drawHandOverlay(null,null);
      gpHandState.textContent='بدون دست'; gpStatus.textContent='کف دست خود را نشان دهید';
      smoothedPinchRatio=null; lastPinchRatio=null; smoothedPalm=null; lastPalm=null;
      candidateShape=null; candidateCount=0; committedShape='NONE';
      return;
    }
    lastHandSeenAt = performance.now(); autoRotate = false;
    const lm = results.multiHandLandmarks[0];
    const raw = classifyHandRaw(lm);
    const shape = debounce(raw.shape);
    drawHandOverlay(lm, shape);
    gpHandState.textContent = 'ردیابی فعال';

    smoothedPinchRatio = smoothedPinchRatio===null ? raw.pinchRatio : lerp(smoothedPinchRatio, raw.pinchRatio, EMA_PINCH);
    if(shape!=='PINCH') lastPinchRatio=null;
    if(shape!=='OPEN'){ lastPalm=null; smoothedPalm=null; }

    if(shape==='PINCH'){
      gpStatus.textContent = 'مشت‌کردن → زوم';
      if(lastPinchRatio!==null){
        const delta = smoothedPinchRatio - lastPinchRatio;
        targetZoom -= delta*ZOOM_SENSITIVITY;
        targetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, targetZoom));
      }
      lastPinchRatio = smoothedPinchRatio;
    } else if(shape==='OPEN'){
      gpStatus.textContent = 'کف دست باز → چرخش';
      const palm = lm[9];
      smoothedPalm = smoothedPalm===null ? {x:palm.x,y:palm.y} : { x: lerp(smoothedPalm.x, palm.x, EMA_PALM), y: lerp(smoothedPalm.y, palm.y, EMA_PALM) };
      if(lastPalm){
        const dx = -(smoothedPalm.x - lastPalm.x), dy = (smoothedPalm.y - lastPalm.y);
        targetRotY += dx*ROTATE_SENSITIVITY; targetRotX += dy*ROTATE_SENSITIVITY;
        targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
      }
      lastPalm = { x:smoothedPalm.x, y:smoothedPalm.y };
    } else {
      gpStatus.textContent = 'کف دست: چرخش · مشت: زوم';
    }
  }
  async function gestureLoop(){
    if(!gestureActive) return;
    if(videoEl && videoEl.readyState>=2) await handsModel.send({ image: videoEl });
    requestAnimationFrame(gestureLoop);
  }
  async function enableGestureControl(){
    gpNote.classList.remove('show');
    gpStatus.textContent = 'در حال درخواست دسترسی دوربین…';
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({ video:{width:480,height:360,facingMode:'user'}, audio:false });
    } catch(err){
      gpStatus.textContent = 'دسترسی دوربین رد شد'; gpNote.classList.add('show'); return;
    }
    videoEl = document.createElement('video');
    videoEl.srcObject = mediaStream; videoEl.muted = true; videoEl.playsInline = true;
    await videoEl.play();
    if(typeof Hands === 'undefined'){
      gpStatus.textContent = 'کتابخانه ردیابی در دسترس نیست'; gpNote.classList.add('show');
      mediaStream.getTracks().forEach(t=>t.stop()); return;
    }
    handsModel = new Hands({ locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    handsModel.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.65, minTrackingConfidence:0.65 });
    handsModel.onResults(onHandResults);
    gestureActive = true;
    gpToggle.textContent = 'غیرفعال‌سازی کنترل با دست'; gpToggle.classList.add('active');
    gpHandState.textContent = 'آماده'; gpStatus.textContent = 'کف دست خود را نشان دهید';
    gestureLoop();
  }
  function disableGestureControl(){
    gestureActive = false;
    if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream = null; }
    videoEl = null;
    gCtx.clearRect(0,0,gCanvas.width,gCanvas.height);
    gpToggle.textContent = 'فعال‌سازی کنترل با دست'; gpToggle.classList.remove('active');
    gpHandState.textContent = 'خاموش'; gpStatus.textContent = 'آماده به کار';
    smoothedPinchRatio=null; lastPinchRatio=null; smoothedPalm=null; lastPalm=null;
  }
  gpToggle.addEventListener('click', ()=>{ gestureActive ? disableGestureControl() : enableGestureControl(); });

  /* ============================================================
     RENDER LOOP
  ============================================================ */
  function easeOutCubic(x){ return 1-Math.pow(1-x,3); }
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const t = now*0.001;
    const elapsed = now - introStart;

    if(introActive && partMesh){
      const gT = Math.max(0, Math.min(1, elapsed/INTRO_MS));
      const s = Math.max(0.001, easeOutBack(gT));
      partMesh.scale.setScalar(s);
      if(gT>=1){ introActive=false; partMesh.scale.setScalar(1); }
    }

    if(gestureActive && !autoRotate && performance.now()-lastHandSeenAt>2500) autoRotate = true;

    if(rotateStick.active){
      targetRotY += rotateStick.x * ROTATE_STICK_SPEED;
      targetRotX += rotateStick.y * ROTATE_STICK_SPEED;
      targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
    }
    if(zoomStick.active){
      targetZoom += zoomStick.y * ZOOM_STICK_SPEED;
      targetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, targetZoom));
    }

    if(autoRotate && !isDragging && !rotateStick.active) targetRotY += 0.0022;

    core.rotation.y += (targetRotY - core.rotation.y)*ROT_DAMP;
    core.rotation.x += (targetRotX - core.rotation.x)*ROT_DAMP;
    camera.position.z += (targetZoom - camera.position.z)*ZOOM_DAMP;
    camera.position.x = Math.sin(t*0.15)*3;
    camera.lookAt(0,0,0);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})();
</script>
</body>
